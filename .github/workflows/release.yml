name: Release

# Builds config.exe with the release version and creates a draft release with it. Started either
# - from the Actions tab ("Run workflow", enter a version such as 1.0.0): the tag vX.Y.Z is created on the built
#   commit when the draft is published, or
# - by pushing a tag such as v1.0.0.
# Publish the draft on the Releases page after checking it. A tag that already has a release (or draft) is skipped, so
# the tag created by publishing a draft does not start a second one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.0.0'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $version = $version.Trim().TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The version must look like 1.2.3, got '$version'." }
          $tag = "v$version"
          "number=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          # Publishing a draft made from the Actions tab creates its tag, and that tag push starts this workflow again.
          $releases = gh release list --limit 1000 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the releases.' }
          if ($releases | ConvertFrom-Json | Where-Object { $_.tagName -ceq $tag }) {
            if ('${{ github.event_name }}' -eq 'workflow_dispatch') { throw "There is already a release or draft for $tag." }
            "::notice::There is already a release or draft for $tag, nothing to do."
            'skip=true' >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.skip != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: dotnet build MT2Config.slnx -c Release "-p:Version=${{ steps.version.outputs.number }}"

      - name: Create draft release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $exe = 'MT2Config/bin/Release/config.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = ".github/release-notes/$tag.md"
          if (Test-Path $notes) {
            (Get-Content $notes -Raw).Replace('{SHA256}', $hash) | Set-Content release-notes.md -Encoding utf8
          } else {
            "SHA-256 of config.exe: ``$hash``" | Set-Content release-notes.md -Encoding utf8
          }
          # A pushed tag already points at this commit; otherwise the tag is created on it when the draft is published.
          $tagOption = @('--verify-tag')
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $tagOption = @('--target', '${{ github.sha }}') }
          gh release create $tag $exe --draft @tagOption --title "MT2Config $tag" --notes-file release-notes.md
